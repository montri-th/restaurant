# Register sync (2026-11-09): every night at 02:17 Thailand time, and on the “Run workflow” button, read the chain
# register sheet (read-only service account), and when the tabs the page uses changed, rebuild the register, its sizes,
# its links to the snapshot brands and the release file with the same scripts as a manual round, refresh the data
# fixtures from a run, run every test, and open (or update) one draft pull request with the report of brands and
# outlets added, changed or gone. Nothing reaches the page until a person merges that pull request; a failed round
# opens nothing and leaves the published data as it is. Setup: AGENTS.md “Register sync”.
name: Register sync
on:
  schedule:
    - cron: '17 19 * * *'   # 02:17 Asia/Bangkok
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: register-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet openpyxl shapely pillow google-auth requests
      - name: Read the sheet and rebuild what changed
        id: build
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.REGISTER_SA_KEY }}
          REGISTER_SHEET_ID: ${{ secrets.REGISTER_SHEET_ID }}
        run: python3 scripts/sync-register.py --work "$RUNNER_TEMP/register" --github-output "$GITHUB_OUTPUT"
      - name: Refresh the data fixtures and run every test
        if: steps.build.outputs.changed == 'true'
        run: |
          npm run fixtures
          npm test
      - name: Report what changes on the page
        if: steps.build.outputs.changed == 'true'
        run: |
          git worktree add "$RUNNER_TEMP/published" origin/main
          node scripts/register-report.mjs --before "$RUNNER_TEMP/published" --md "$RUNNER_TEMP/report.md" --json "$RUNNER_TEMP/report.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, os, sys
          t = sys.argv[1]
          pending = json.load(open(os.path.join(t, 'register/pending.json')))
          read = json.load(open('data/release.json'))['register']
          lines = [
              f"อ่านชีต {read['readAt'].replace('T', ' ')[:16]} น. · ชีตแก้ล่าสุด {(read.get('sheetModifiedAt') or '—').replace('T', ' ')[:16]} · SHA-256 ชุดข้อมูล `{read['sourceSha256'][:16]}…`",
              '', 'ทดสอบ: `npm test` ผ่านทั้งหมดในงานนี้ (fixtures สร้างใหม่จากการรัน ค่าเดิมอยู่ใน history ของ tests/fixtures/data-snapshot.json)', '',
              open(os.path.join(t, 'report.md'), encoding='utf-8').read(), '',
              '**ยังต้องทำในรอบที่คนทำ (ไม่ได้ทำในงานอัตโนมัติ)**',
              f"- ความสัมพันธ์กับอาคาร Land: ยังเป็นฉบับจับคู่ {pending['landCheckedOn']} — สาขาที่เพิ่มหรือย้ายพิกัดหลังจากนั้นยังไม่มีอาคาร (build-land ใช้ทะเบียน Land ภายใน)",
              f"- โลโก้ที่ทะเบียนชี้ไฟล์ใหม่: {len(pending['logosPending'])} เครือ" + (f" ({', '.join(pending['logosPending'][:12])})" if pending['logosPending'] else ''),
              '- ถ้าข้อค้นพบแรกในตารางเปลี่ยน ให้แก้ตัวเลขใน README และ PRODUCT_STATEMENT ก่อน merge', '',
              'เผยแพร่: merge pull request นี้ — GitHub Pages ขึ้นเว็บเอง และ register-stamp ใส่วันที่เผยแพร่ใน data/release.json']
          open(os.path.join(t, 'body.md'), 'w', encoding='utf-8').write('\n'.join(lines) + '\n')
          PY
      - name: Open or update the pull request
        if: steps.build.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          READ_AT: ${{ steps.build.outputs.read_at }}
        run: |
          branch=register-sync
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add data docs tests/fixtures
          git commit -m "Register read ${READ_AT}: rebuilt chains, sizes, links and fixtures"
          git push --force origin "$branch"
          title="ทะเบียนร้านเครือ อ่าน ${READ_AT:0:10} — ${{ steps.build.outputs.outlets }} สาขา ${{ steps.build.outputs.brands }} เครือ"
          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --draft --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
      - name: Summary
        if: always()
        run: |
          echo "changed=${{ steps.build.outputs.changed }} skipped=${{ steps.build.outputs.skipped }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/body.md" ]; then cat "$RUNNER_TEMP/body.md" >> "$GITHUB_STEP_SUMMARY"; fi
